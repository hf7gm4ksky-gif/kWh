<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Luv with Hands - 마음을 잇는 수어 학습</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FDFBF7;--card:#fff;--line:#EFEFEF;--pri:#FF8A7A;--pri-d:#E86F5E;--sec:#6C8EA4;--tx:#333;--sub:#777;--soft:#F8F9FA;--gem:#3FA6E0;--ok:#58B98A;--bad:#E5675B;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1D1B19;--card:#2A2724;--line:#3A3632;--tx:#F2EEE8;--sub:#A9A39B;--soft:#332F2B}}
html{height:100%}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Noto Sans KR',-apple-system,'Malgun Gothic',sans-serif}
body{background:var(--bg);color:var(--tx);height:100%;display:flex;justify-content:center;align-items:center;padding:12px}
.app{position:relative;width:100%;max-width:420px;height:min(850px,100%);background:var(--card);border-radius:32px;overflow:hidden;box-shadow:0 20px 40px rgba(0,0,0,.06);display:flex;flex-direction:column}
.header{padding:20px 22px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.logo{font-size:20px;font-weight:700;color:var(--pri);letter-spacing:-.5px}
.badges{display:flex;gap:6px}
.badge{padding:6px 11px;border-radius:20px;font-size:13px;font-weight:700;background:rgba(255,138,122,.12);color:var(--pri)}
.badge.gem{background:rgba(79,179,232,.14);color:var(--gem)}
.content{flex:1;overflow-y:auto;padding:4px 22px 20px}
h1{font-size:23px;line-height:1.4;margin-bottom:2px}
.sub{color:var(--sub);font-size:14px;font-weight:300;margin-bottom:16px;line-height:1.5}
.hero{background:linear-gradient(135deg,#FF9E90,#FF8A7A);border-radius:24px;padding:22px;color:#fff;margin-bottom:18px;box-shadow:0 12px 20px rgba(255,138,122,.25)}
.hero h2{font-size:21px;margin-bottom:6px}
.hero p{font-size:14px;opacity:.92;line-height:1.6;margin-bottom:16px}
.btn{width:100%;border:none;border-radius:16px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;background:var(--pri);color:#fff;box-shadow:0 4px 0 var(--pri-d);transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--pri-d)}
.btn.white{background:#fff;color:var(--pri);box-shadow:0 4px 0 rgba(0,0,0,.12)}
.btn.ghost{background:var(--soft);color:var(--sub);box-shadow:none;margin-top:10px}
.title{font-size:16px;font-weight:700;margin:4px 0 12px;display:flex;justify-content:space-between;align-items:center}
.title span{font-size:12px;color:var(--sub);font-weight:400}
.box{background:var(--soft);border-radius:20px;padding:16px;margin-bottom:18px}
.bar{background:var(--line);border-radius:10px;height:10px;overflow:hidden;margin-bottom:8px}
.bar i{display:block;height:100%;background:var(--sec);border-radius:10px;transition:width .5s}
.row{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);margin-bottom:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.wc{border:1.5px solid var(--line);border-radius:18px;padding:14px 8px;text-align:center;background:var(--card);cursor:pointer}
.wc .ic{font-size:28px;display:block;margin-bottom:6px}
.wc b{font-size:14px;display:block;margin-bottom:2px}
.wc small{font-size:11px;color:var(--sub);display:block}
.wc.lock{background:var(--soft);cursor:default}
.wc.lock .ic{filter:grayscale(1);opacity:.45}
.wc.done{border-color:var(--ok)}
.btn:disabled{background:var(--line);color:var(--sub);box-shadow:none;cursor:default}
.ov{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:24px;z-index:999}
.dlg{background:var(--card);border-radius:20px;padding:22px;width:100%}
.dlg p{margin-bottom:14px;font-weight:500;line-height:1.5}
.slot,.tg3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{min-height:100px;border:2px dashed var(--line);border-radius:16px;padding:8px;margin:12px 0;align-content:start}
.tg3 .opt,.slot .opt{padding:6px;margin:0}
.rwp{position:relative;margin-bottom:12px}
.rw{overflow-x:auto;border-radius:22px}
.rw .room{margin:0;border-radius:0;min-width:100%}
.bgd{position:absolute;transform:translate(-50%,-50%);pointer-events:none;line-height:1}
.scb{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px}
.chip{white-space:nowrap;flex:none;padding:8px 12px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);color:var(--sub);font-weight:700;font-size:13px;cursor:pointer}
.chip.on{border-color:var(--pri);color:var(--pri);background:rgba(255,138,122,.08)}
.chip:disabled{opacity:.5;cursor:default}
.splash,.auth{height:100%;display:flex;flex-direction:column;justify-content:center;padding:28px}
.splash{align-items:center;text-align:center}
.auth{text-align:center}
.sp-logo{font-size:84px;line-height:1.1;margin-bottom:8px}
.sp-t{font-size:28px;font-weight:700;color:var(--pri);letter-spacing:-.5px;margin-bottom:6px}
.sp-bar{width:60%;margin:26px auto 10px;opacity:0;transition:opacity .4s}
.in{width:100%;border:2px solid var(--line);background:var(--card);color:var(--tx);border-radius:14px;padding:13px 14px;font-size:16px;margin-bottom:10px;outline:none}
.in:focus{border-color:var(--pri)}
.err{min-height:20px;color:var(--bad);font-size:13px;margin-bottom:8px}
.lnk{background:none;border:none;color:var(--pri);font-weight:700;font-size:13px;cursor:pointer;text-decoration:underline}
.sm{margin-top:8px;border:none;background:rgba(79,179,232,.14);color:var(--gem);font-weight:700;font-size:12px;padding:7px 10px;border-radius:12px;cursor:pointer}
.sm:disabled{opacity:.45;cursor:default}
.sm.on{background:rgba(88,185,138,.18);color:var(--ok)}
.nav{border-top:1px solid var(--line);padding:8px 14px;display:flex;background:var(--card)}
.nav button{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;color:#B5B5B5;font-size:11px;cursor:pointer;padding:4px}
.nav button.on{color:var(--pri);font-weight:700}
.nav .e{font-size:20px}
.lesson{display:flex;flex-direction:column;height:100%;padding:20px 22px;overflow-y:auto}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.x{background:none;border:none;font-size:22px;color:var(--sub);cursor:pointer}
.top .bar{flex:1;margin:0}
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center}
.big{font-size:80px;margin-bottom:10px}
.word{font-size:28px;font-weight:700;margin-bottom:6px}
.sg{background:var(--soft);border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;overflow:hidden;object-fit:cover}
.sg.lg{height:200px;margin:10px 0 16px}.sg.lg span{font-size:84px}
.sg.sm2{height:84px}.sg.sm2 span{font-size:42px}
.sg small{font-size:11px;color:var(--sub);margin-top:4px}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:var(--card);color:var(--tx);border-radius:16px;padding:14px 16px;font-size:15px;font-weight:500;margin-top:10px;cursor:pointer}
.opt.ok{border-color:var(--ok);background:rgba(88,185,138,.14)}
.opt.bad{border-color:var(--bad);background:rgba(229,103,91,.12)}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tg .opt{padding:6px;margin:0}
.fb{min-height:24px;font-weight:700;font-size:14px;margin:12px 0}
.room{position:relative;height:300px;border-radius:22px;overflow:hidden;margin-bottom:12px;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.35) 0 18px,transparent 18px 36px)}
.floor{position:absolute;left:0;right:0;bottom:0;height:36%;background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.07) 0 2px,transparent 2px 56px)}
.floor::before{content:"";position:absolute;left:0;right:0;top:0;height:7px;background:rgba(0,0,0,.12)}
.it{position:absolute;transform:translate(-50%,-50%);cursor:grab;touch-action:none;user-select:none;border-radius:12px}
.it.sel{outline:2px dashed var(--pri);outline-offset:2px}
.it svg{display:block;overflow:visible}
.bubble{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#fff;color:#333;padding:6px 12px;border-radius:14px;font-size:12px;font-weight:500;white-space:nowrap;z-index:200}
.selbar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.selbar b{flex:1;font-size:14px}
.selbar button{border:1.5px solid var(--line);background:var(--card);color:var(--tx);border-radius:12px;padding:7px 12px;font-weight:700;cursor:pointer}
.tail{transform-origin:88px 102px;animation:wag 2.6s ease-in-out infinite}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
@keyframes wag{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(10deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.seg{display:flex;gap:8px;margin-bottom:12px}
.seg button{flex:1;padding:10px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--sub);font-weight:700;font-size:13px;cursor:pointer}
.seg button.on{border-color:var(--pri);color:var(--pri);background:rgba(255,138,122,.08)}
.sw{display:inline-block;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);vertical-align:middle;margin-right:4px}
.pop{animation:pop .5s}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.pop,.tail,.eyes{animation:none}.bar i{transition:none}}
@media (max-width:440px){body{padding:0}.app{border-radius:0;height:100%}}
</style>
</head>

   else b='<div class="stage" style="justify-content:flex-start"><p class="sub" style="margin-bottom:6px">이 단어에 맞는 수어를 골라보세요.</p><div class="word">'+q.w.t+'</div><div class="tg">'+o.map(function(x){return '<button class="opt" data-id="'+x.id+'" onclick="answer(this,'+x.id+')">'+sign(x,'sm2')+'</button>'}).join('')+'</div><div class="fb" id="fb"></div></div>';
   b+='<button class="btn" id="nx" style="display:none" onclick="nextQ()">계속하기</button>'}}
 $('<div class="lesson">'+top+b+'</div>');if(sent)drawS()}
function drawS(){var c=L.cs;
 document.getElementById('slot').innerHTML=c.chosen.map(function(id){return '<button class="opt" onclick="popS('+id+')">'+sign(W[id-1],'sm2')+'</button>'}).join('');
 document.getElementById('bank').innerHTML=c.bank.filter(function(id){return c.chosen.indexOf(id)<0}).map(function(id){return '<button class="opt" onclick="addS('+id+')">'+sign(W[id-1],'sm2')+'</button>'}).join('');
 document.getElementById('chk').disabled=c.chosen.length!==c.ans.length}
function addS(id){var c=L.cs;if(c.done||c.chosen.length>=c.ans.length)return;c.chosen.push(id);drawS()}
function popS(id){var c=L.cs;if(c.done)return;c.chosen.splice(c.chosen.indexOf(id),1);drawS()}
function checkS(){var c=L.cs;if(c.done)return;c.done=true;var ok=c.chosen.join()===c.ans.join(),g=L.quest?10:4;
 if(ok){L.right++;L.earned+=g;if(S.sdone.indexOf(c.idx)<0)S.sdone.push(c.idx)}
 var fb=document.getElementById('fb');fb.style.color=ok?'var(--ok)':'var(--bad)';
 fb.textContent=ok?'문장 완성! 💎 +'+g:'정답 순서: '+c.ans.map(function(id){return W[id-1].t}).join(' → ');
 document.getElementById('chk').style.display='none';document.getElementById('nx').style.display='block';
 document.querySelectorAll('#slot .opt,#bank .opt').forEach(function(o){o.disabled=true})}
function nextLearn(){if(L.i<L.learn.length-1)L.i++;else L.phase='quiz';draw()}
function answer(el,id){
 var q=L.qs[L.qi].w,ok=id===q.id,g=L.quest?5:2;
 document.querySelectorAll('.opt').forEach(function(o){o.disabled=true;if(+o.dataset.id===q.id)o.classList.add('ok')});
 if(!ok)el.classList.add('bad');else{L.right++;L.earned+=g}
 var fb=document.getElementById('fb');fb.style.color=ok?'var(--ok)':'var(--bad)';
 fb.textContent=ok?'정답! 💎 +'+g:'정답은 "'+q.t+'"예요';
 document.getElementById('nx').style.display='block'}
function nextQ(){if(L.qi<L.qs.length-1){L.qi++;draw()}else finish()}
function finish(){
 L.learn.forEach(function(w){if(S.learned.indexOf(w.id)<0)S.learned.push(w.id)});
 var bonus=0,first=L.quest&&S.done!==T,old=S.lv;
 if(first){bonus=10+2*S.lv;S.streak=(S.last===Y)?S.streak+1:1;S.last=T;S.done=T}
 if(L.quest)S.lv+=1;
 var total=L.earned+bonus;S.gems+=total;save();
 $('<div class="lesson"><div class="stage"><div class="big pop">'+(L.quest?'🎉':'💎')+'</div><div class="word">'+(L.quest?'퀘스트 클리어!':'수고했어요!')+'</div><p class="sub">'+L.right+' / '+L.qs.length+' 정답</p><div class="box"><div class="row"><span>정답 보상</span><b>💎 '+L.earned+'</b></div>'+(bonus?'<div class="row"><span>퀘스트 보너스</span><b>💎 '+bonus+'</b></div>':'')+'<div class="row"><span>받은 보석</span><b style="color:var(--gem)">💎 '+total+'</b></div></div>'+(L.quest?'<p class="sub">🆙 Lv.'+old+' → Lv.'+S.lv+(first?' · 연속 학습 '+S.streak+'일째!':'')+'</p>':'')+'</div><button class="btn" onclick="L=null;go(\'cat\')">방 꾸미러 가기 🐱</button><button class="btn ghost" onclick="L=null;go(\'home\')">홈으로</button></div>')}
function quit(){ask('지금 나가면 이번 학습 기록이 사라져요.','나가기',function(){L=null;render()})}
/* 계정 (이 기기에만 저장돼요) */
var AU='lwh_users',AS='lwh_session';
function users(){try{return JSON.parse(localStorage.getItem(AU))||{}}catch(e){return{}}}
function fh(t){var h=5381;for(var i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0;return 'f'+(h>>>0).toString(16)}
function hash(t){return new Promise(function(res){try{if(window.crypto&&crypto.subtle){crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)).then(function(b){res(Array.from(new Uint8Array(b)).map(function(x){return ('0'+x.toString(16)).slice(-2)}).join(''))},function(){res(fh(t))});return}}catch(e){}res(fh(t))})}
function v(i){return document.getElementById(i).value}
function err(m){var e=document.getElementById('er');if(e)e.textContent=m}
function splash(){
 $('<div class="splash"><div class="sp-logo pop">🤟</div><div class="sp-t">Luv with Hands</div><p class="sub">마음을 잇는 수어 학습</p><div class="bar sp-bar" id="spw"><i id="spb" style="width:0;transition:width 1.2s ease"></i></div><p class="sub" id="spt" style="opacity:0;transition:opacity .4s">불러오는 중...</p></div>');
 setTimeout(function(){var a=document.getElementById('spw'),b=document.getElementById('spb'),t=document.getElementById('spt');if(!a)return;a.style.opacity=1;t.style.opacity=1;b.style.width='100%'},1000);
 setTimeout(function(){var u=null;try{u=localStorage.getItem(AS)}catch(e){}if(u&&users()[u])enter(u);else loginView()},2400)}
function enter(id){KEY='lwh2_'+id;loadU();S.name=users()[id].nick;try{localStorage.setItem(AS,id)}catch(e){}tab='home';render()}
function logout(){try{localStorage.removeItem(AS)}catch(e){}loginView()}
function loginView(){
 $('<div class="auth"><div class="sp-logo" style="font-size:60px">🤟</div><div class="sp-t">Luv with Hands</div><p class="sub">로그인하고 이어서 배워요</p><input id="a1" class="in" placeholder="아이디" autocomplete="username" autocapitalize="none" onkeydown="if(event.key===\'Enter\')doLogin()"><input id="a2" class="in" type="password" placeholder="비밀번호" autocomplete="current-password" onkeydown="if(event.key===\'Enter\')doLogin()"><div class="err" id="er"></div><button class="btn" onclick="doLogin()">로그인</button><p class="sub" style="margin:20px 0 0;font-size:13px">처음이시라면? <button class="lnk" onclick="signupView()">회원가입</button></p></div>')}
function signupView(){
 $('<div class="auth"><div class="sp-t">회원가입</div><p class="sub">아이디, 비밀번호, 닉네임만 있으면 돼요</p><input id="a3" class="in" placeholder="닉네임 (1~8자)" maxlength="8"><input id="a1" class="in" placeholder="아이디 (영문 소문자·숫자·_ 4~12자)" maxlength="12" autocomplete="username" autocapitalize="none"><input id="a2" class="in" type="password" placeholder="비밀번호 (6자 이상)" autocomplete="new-password" onkeydown="if(event.key===\'Enter\')doSignup()"><div class="err" id="er"></div><button class="btn" onclick="doSignup()">가입하고 시작하기</button><p class="sub" style="margin:20px 0 0;font-size:13px">이미 계정이 있나요? <button class="lnk" onclick="loginView()">로그인</button></p></div>')}
function doLogin(){var id=v('a1').trim().toLowerCase(),pw=v('a2'),u=users()[id];
 if(!id||!pw)return err('아이디와 비밀번호를 입력해 주세요.');
 if(!u)return err('아이디 또는 비밀번호가 맞지 않아요.');
 hash(u.salt+pw).then(function(h){if(h!==u.h)return err('아이디 또는 비밀번호가 맞지 않아요.');enter(id)})}
function doSignup(){var nk=v('a3').trim(),id=v('a1').trim().toLowerCase(),pw=v('a2'),us=users();
 if(!nk||nk.length>8)return err('닉네임은 1~8자로 입력해 주세요.');
 if(!/^[a-z0-9_]{4,12}$/.test(id))return err('아이디는 영문 소문자·숫자·_ 4~12자예요.');
 if(pw.length<6)return err('비밀번호는 6자 이상이에요.');
 if(us[id])return err('이미 있는 아이디예요.');
 var salt=Math.random().toString(36).slice(2);
 hash(salt+pw).then(function(h){var first=!Object.keys(us).length;us[id]={h:h,salt:salt,nick:nk};
  try{localStorage.setItem(AU,JSON.stringify(us));if(first){var old=localStorage.getItem('lwh2');if(old)localStorage.setItem('lwh2_'+id,old)}}catch(e){}
  enter(id)})}
splash();
</script>
</body>
</html>
